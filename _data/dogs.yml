- name: Ruben
  alter: 09/2021
  größe: Mittelgroß
  geschlecht: Männlich
  charakter: lieb, aktiv, verspielt, neugierig, sozial, verschmust
  hunde_nummer: 506
  text_hund: Ruben ist ein totaler Schmuser, verträglich mit Artgenossen, aktiv und neugierig. Er wurde mit seinen Brüdern zusammen ausgesetzt. Bald darf Tony, mit dem sich Ruben einen Zwinger teilt, ausreisen und er bleibt allein zurück
  text_zuhause: Für Ruben suchen wir Menschen, die ihm viel Aufmerksamkeit schenken und selbst noch gut zu Fuß sind.
- name: Roby
  alter: 09/2021
  größe: Mittelgroß
  geschlecht: Männlich
  charakter: schüchtern, vermust, freundlich, gegenüber Artgenossen sehr vorsichtig
  hunde_nummer: 818h
  text_hund: Roby ist anfangs unsicher und schüchtern. Gegenüber Frauen taut er deutlich schneller auf. Hast du einmal sein Vertrauen gewonnen, dann ist er ein großer Schmuser und freut sich über Aufmerksamkeiten. Roby wurde mit seinen Brüdern ausgesetzt. Er ist sehr menschenbezogen und freundlich. Bei einer Beißerei wurde er schwer verletzt und seine Rute musste amputiert werden. Dadurch musste er lange Zeit in der Klinik verbingen, was für ihn keine schöne Erfahrung war. Heute ist Roby gesund und munter und bereit für ein neues Zuhause. Roby muss zwingend Nassfutter gefüttert bekommen.
  text_zuhause: Roby braucht ein Zuhause mit souveräner Führung und Geduld. Er braucht Zeit, um Vertrauen zu fassen (das fällt ihm bei Frauen leichter als bei Männern). Erfahrung mit ängstlichen Hunden wäre wünschenswert.
  notfall: true
- name: Lucky
  alter: 08/2019
  größe: groß
  geschlecht: Männlich
  charakter: sanft, freundlich, liebevoll, aktiv, ruhig
  hunde_nummer: 800
  text_hund: Lucky ist ein unheimlich sanfter, freundlicher und liebevoller Rüde. Wir vermuten, dass Schäferhund in ihm steckt. Lucky wurde aus einem illegalen Shelter gerettet, in welchem er unter furchtbaren Bedingungen leben musste. 2024 ist seine beste Freundin Cora, mit der er sich seinen Zwinger geteilt hat, verstorben. Lucky trauert sehr um Cora.
  text_zuhause: Wir wünschen uns für Lucky liebevolle Menschen, die seine anfängliche Skepsis gegenüber Neuem nicht abschreckt. Lucky ist, sobald er Vertrauen gefasst hat, ein ganz sanfter und toller Rüde!
  notfall: true
- name: Sugar
  alter: 08/2019
  größe: klein bis mittelgroß
  geschlecht: Weiblich
  charakter: schüchtern, ängstlich, lieb, unterwürfig, freundlich
  hunde_nummer: 783
  text_hund: Sugar hatte bisher wenig Glück in ihrem Leben. 2021 wurde sie von uns aus einem illegalen Shelter in Gheorghenie gerettet, in welchem sie mutmaßlich jahrelang den schlimmen Haltungsbedingungen ausgesetzt war. Bei uns im Afumati-Tierheim brachte sie dann zwei Babies zur Welt, doch durch Sugar's Mangelernährung während der Schwangerschaft waren beide Welpen nicht lebensfähig. Sugar lebt bei uns allein in einem Zwinger, da sie von anderen Hunden oftmals drangsaliert wurde - sie ist zu schüchtern und zu lieb, um sich zu behaupten. Sugar ist noch schüchtern und ängstlich, ist dabei aber niemals aggressiv. Sie lässt sich problemlos anfassen und macht sehr große Forschritte.
  text_zuhause: Für Sugar wünschen wir uns geduldige und liebevolle Menschen, die ihr ausreichend Zeit geben, um Vertrauen aufzubauen. Man sollte freundlich und geduldig mit ihr umgehen, und dann wird die kleine Sugar ein ganz toller Begleiter sein!
  notfall: true
