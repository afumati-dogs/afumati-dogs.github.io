  text_zuhause: Für Ronja wünschen wir uns geduldige, liebevolle Menschen, die ihr die Zeit geben, die sie braucht. Ein souveräner Ersthund würde Ronja sehr helfen anzukommen und Vertrauen zu fassen.
- name: Mailo
