  hunde_nummer: 752
  text_hund: Jakov ist gut mit Artgenossen verträglich und ein freundlicher Rüde. Er kam aus einem illegalen Shelter in Gheorghenie ganz hoffnungslos bei uns an - seinen Traum, ein liebevolles Zuhause zu finden hatte er aufgegeben. Nun wartet Jakov seit 2021 und seine Hoffnung schwindet zunehmend. Er freut sich über Auslauf und mag seine Hundekumpels sehr, aber auch das beste Tierheim ersetzt kein liebevolles Zuhause.
  text_zuhause: Wir wünschen uns für Jakov Menschen mit Hundeerfahurng und Empathie, die ihm genug Zeit zum ankommen geben und ihm zeigen, wie schön ein Hundeleben sein kann. Ein sozialer Ersthund wäre von Vorteil, damit Jakov es leichter hat Vertrauen zu fassen.
