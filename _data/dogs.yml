  text_hund: Curry ist noch vorsichtig und braucht Zeit, um Vertrauen aufzubauen. Sie ist sehr clever, freundlich, eher unterwürfig und aufgeweckt. Sie freut sich über kleine Aufmerksamkeiten.
  text_zuhause: Für Curry suchen wir geduldige Menschen, die ihr ausreichend Zeit geben, um Vertrauen aufzubauen. Hundeerfahrung wäre von Vorteil.
