  hunde_nummer: 769
  text_hund: Lika ist eine wunderschöne Hündin, die Bewegung liebt und 2021 aus einem illegalen Shelter in Gheorghenie gerettet wurde. Lika ist, vor allem gegenüber Männern, sehr vorsichtig. Sie macht aber unheimlich tolle Fortschritte bei uns. Likea ist eine freundliche, aufgeschlossene und neugierige Hündin.
  text_zuhause: Für Lika wünschen wir uns ein liebevolles, geduldiges Zuhause, das ihr dabei hilft, Vertrauen zu fassen. Sie braucht Menschen, die gern aktiv sind und sich ihr liebevoll annehmen.
- name: Jerry
