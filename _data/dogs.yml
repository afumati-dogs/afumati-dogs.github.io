  text_hund: Mitena wurde 2021 mit vielen anderen Hunden aus einem illegalen Shelter in Gheorghenie gerettet. Sie schmust unhiemlich gern, genießt die Aufmerksamkeit und liebt den Auslauf. Mitena ist ein ruhiger, dankbarer Schmusebär, und wünscht sich einfach nur geliebt zu werden und gewollt zu sein. Sie ist verträglich mit ihren Artgenossen, kann sich dabei sehr gut durchsetzen.
  text_zuhause: Mitena hat keine hohen Ansprüche - in einem Körbchen zu liegen und Zuneigung zu bekommen ist ihr großer Traum. Mitena ist mit Artgenossen verträglich und genügsam, freundlich und zutraulich. Ein ruhiges Zuhause wäre schön für Mitena. Sie kann auch in eine Familie mit Kindern ziehen.
