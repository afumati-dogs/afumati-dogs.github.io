  text_zuhause: Mailo sucht ein liebevolles, fürsorgliches Zuhause. Er zeigt sich mit Artgenossen beiderlei Geschlechts gut verträglich. Mailo ist eher ein ruhiger Genossen, genießt aber auch seinen Auslauf.
