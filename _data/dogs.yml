- name: Roby
  age: 09.2021
  size: Mittelgroß
  sex: Männlich
  character: schüchtern, vermust, freundlich, gegenüber Artgenossen sehr vorsichtig
  dog_number: 818h
  text_dog: Roby ist anfangs unsicher und schüchtern. Gegenüber Frauen taut er deutlich schneller auf. Hast du einmal sein Vertrauen gewonnen, dann ist er ein großer Schmuser und freut sich über Aufmerksamkeiten. Roby wurde mit seinen Brüdern auf einem Feld gefunden. Er ist sehr menschenbezogen und freundlich. Dei einer Beißerei wurde er schwer verletzt und seine Rute musste amputiert werden. Dadurch musste er lange Zeit in der Klinik verbingen, was für ihn keine schöne Erfahrung war. Heute ist Roby gesund und munter und bereit für ein neues Zuhause. Roby muss zwingend Nassfutter gefüttert bekommen.
  text_home: Roby braucht ein Zuhause mit souveräner Führung und Geduld. Er braucht Zeit, um Vertrauen zu fassen (das fällt ihm bei Frauen leichter als bei Männern). Erfahrung mit ängstlichen Hunden wäre wünschenswert.
- name: Lucky
  age: 08.2019
  size: groß
  sex: Männlich
  character: sanft, freundlich, liebevoll, aktiv, ruhig
  dog_number: 800
  text_dog: Lucky ist ein unheimlich sanfter, freundlicher und liebevoller Rüde. Wir vermuten, dass Schäferhund in ihm steckt. Lucky wurde aus einem illegalen Shelter gerettet, in welchem er unter furchtbaren Bedingungen leben musste. 2024 ist seine beste Freundin Cora, mit der er sich seinen Zwinger geteilt hat, verstorben. Lucky trauert sehr um Cora.
  text_home: Wir wünschen uns für Lucky liebevolle Menschen, die seine anfängliche Skepsis gegenüber Neuem nicht abschreckt. Lucky ist, sobald er Vertrauen gefasst hat, ein ganz sanfter und toller Rüde!
