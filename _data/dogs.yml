  geschlecht: Weiblich
  charakter: zurückhaltend, freundlich
  hunde_nummer: 500
  text_hund: Senta und ihre sechs Welpen wurden in drei Plastiksäcke gestopft und ihrem Schicksal überlassen. Glücklicherweise konnten wir sie retten. Sentas Welpen sind mittlerweile alle vermittelt..nur Senta blieb zurück, immer übersehen. In Sentas Augen sieht man wie viel Leid sie schon ertragen musste.
  text_zuhause: Für Senta suchen wir idealerweise ein Zuhause ohne Artgenossen, da sie nicht mit allen verträglich ist. Wir wünschen uns eine liebevolle Familie mit viel Geduld und Verständnis für diese hübsche Hündin. Wer Senta die Zeit gibt, die sie braucht wird einen ganz tollen Hund an seiner Seite wissen!
