- name: Laila
  alter: 12.2015
  größe: mittelgroß
  geschlecht: Weiblich
  charakter: charmant, intelligent, sehr verschmust, aufgeschlossen, menschenbezogen, liebevoll, sehr sozial, genügsam, gut umgänglich
  text_hund:  Laila ist einfach ein aboluter Goldschatz - unser Oberschmusi, unheimlich charmant, hat so viel Liebe zu geben, versteht sich hervorragend mit jedem, leicht umgänglich. Laila strahlt nur so vor Lebensfreude und Dankbarkeit.
  text_zuhause: Laila hat Arthrose und bekommt dafür Arthoprotect. Ihr geht es sehr gut damit, sie rennt und spielt und hat keine Schmerzen. Dennoch wünschen wir uns ein Zuhause mit möglich wenig Treppen oder alternativ einem Aufzug. Laila können wir uns in einem Zuhause mit Kindern oder Artgenossen genauso gut vorstellen, wie als Ersthund. Sie ist unheimlich freudnlich und dank ihrer lieben Art auch für Anfänger geeignet. 
- name: Rosi
  alter: 08.2019
  größe: groß
  geschlecht: Weiblich
  charakter: ruhig, sanft, ängstlich, schüchtern
  hunde_nummer: 787
  text_hund:  Rosi wurde aus einem illegalen Shelter in Gheorghenie gerettet. Seit ihrer rettung im Jahr 2021 wartet sie nun im Tierheim auf ihre Menschen. Sie ist eine liebenswerte, schüchterne Hündin, die sich nicht vordrängt und lieber das Geschene aus einer gewissen Entfernung beobachtet. Sie braucht viel Zeit, um Vertrauen zu fassen - zu oft wurde sie von Menschen verstoßen.
  text_zuhause: Für Rosi suchen wir eine Familie oder Einzelperson, die ihr so viel Zeit gibt, wie nötig - geduldige, empathische Menschen sind essentiell für Rosi. Sie wird ängstlich auf verschiedene Alltagssituationen reagieren und braucht jemanden, der sie dabei geduldig und liebevoll begleitet und ihr zeigt, wie schön ein Hundeleben in Sicherheit sein kann.
- name: Mathilda
  alter: 08.2018
  größe: mittelgroß
  geschlecht: Weiblich
  charakter: schüchtern, ängstlich, vorsichtig, lieb
  hunde_nummer: 747
  text_hund: Mathilda wurde 2021 aus einem illegalen Shelter in Gheorghenie gerettet. Im Tierheim zeigt sie sich sozial und lieb, aber auch sehr vorsichtig. Sie lässt sich streicheln und anfassen, ist niemals aggressiv, aber ist ängstlich und braucht Zeit, um Vertrauen zu fassen. Mathilda kann sich im Rudel nicht behaupten und ist sehr unterwürfig. Oft steht sie aufgrund dessen etwas hinten an. Sie ist nicht in ihrer Angst gefangen, sondern lässt menschlichen Kontakt zu und freut sich darüber. Die sanftmütige Mathilda braucht einfach nur ein liebes, geduldiges Zuhause. 
  text_zuhause: Für Mathilda suchen wir geduldige, liebe Menschen, die ihr die Zeit geben, die sie braucht. Mathilda muss unbedingt aus dem Tierheim kommen, bevor sie sich ganz aufgibt und noch zurückhaltender wird. Immer wird diese schöne Hündin übersehen, steht im Schatten der anderen, und wartet einfach nur auf ihre Chance!
- name: Milan
  alter: 08.2018
  größe: mittelgroß
  geschlecht: Männlich
  charakter: schüchtern, vorsichtig, skeptisch, lieb, ruhig
  hunde_nummer: 745
  text_hund: Milan ist ein ruhiger, vorsichtiger und schüchterner Rüde. Er ist nicht aggressiv, lässt sich anfassen und streicheln. Er ist überhaupt kein Streithahn, stellt sich immer hinten an, ist unheimlich sozial und möchte einfach keine Probleme machen. Er kann es gar nicht glauben, dass es liebe Menschen gibt, die ihn streicheln möchten und ihm Aufmerksamkeit schenken. Unser hübscher Milan braucht einfach nur etwas Zeit, um Vertrauen zu lernen.
  text_zuhause: Für Milan suchen wir geduldige, liebe Menschen, gern mit Hundeerfahrung. Er braucht viel Zeit und Liebe, um in seinem neuen Leben anzukommen. Daher sind ruhige, selbstsichere Menschen unerlässlich für Milan. 
- name: Leo
  alter: 08.2014
  größe: klein - mittelgroß
  geschlecht: Männlich
  charakter: aktiv, intelligent, genügsam, sozial, freundlich
  hunde_nummer: 781
  text_hund: 2021 haben wir Leo aus einem illegalen Shelter in Gheorghenie gerettet. Leo ist ein sehr sozialer, freundlicher Rüde, der immernoch sehr aktiv ist und topfit. Leo ist genügsam und gut mit anderen verträglich.
  text_zuhause: Leo ist ein simpler, und genügsamer Hund - Hundeerfahrung ist keine Voraussetzung, um den schönen Rüden zu adoptieren. Genauso können wir uns Leo auch mit Kindern vorstellen.
- name: Willy
  alter: 02.2018
  größe: groß
  geschlecht: Männlich
  charakter: aktiv, neugierig, freundlich
  hunde_nummer: 776
  text_hund: Willy wurde 2021 aus einem illegalen Shelter gerettet. Er ist freundlich und gibt in seinem Zwinger den Ton an. Willy lebt mit Leo zusammen in einem Zwinger. Er ist aktiv und sozial. Mit seinem wunderschönen,langem, schokobraunen Fell sticht er einem direkt ins Auge. Anfangs ist Willy etwas schüchtern gegenüber Fremden, zeigt sich im Shelter aber sehr neugierig und selbstbewusst.
  text_zuhause: Willy sollte in ein hundeerfahrenes Zuhause reisen, gern auch zu aktiven Senioren (super toll wäre da natürlich ei Garten, das ist aber kein Muss). Willy möchte gern gefordert und gefördert werden. Bei Rüden entscheidet die Sympathie, mit Hündinnen ist er gut verträglich.
- name: Jeff
  alter: 08.2015
  größe: mittel - groß
  geschlecht: Männlich
  charakter: aktiv, intelligent, ruhig, schüchtern, unterwürfig
  hunde_nummer: 748
  text_hund: Jeff wurde 2021 aus einem illegalen Shelter in Gheorghenie gerettet. Er ist höchstwahrscheinlich ein Husky-Mix. Der ruhige, hübsche Rüde wird von uns seperat gefüttert, weil er von den anderen Hunden futter-gemobbt wird. Jeff ist kein dominanter Typ. Er ist sehr sozial und eher unterwürfig. Jeff ist topfit und agil, er liebt den Auslauf auf unserer Wiese. Jeff ist sehr lieb und genügsam. 
  text_zuhause: Für Jerry wünsche wir uns liebevolle Menschen, gern mit Hundeerfahrung, ist aber kein Muss. Wir könnten uns gut vorstellen, dass er zu aktiven Senioren ziehen kann. Jeff braucht noch viel Auslauf, weshalb längere Spaziergänge sehr schön für ihn wären.
