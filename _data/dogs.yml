  hunde_nummer: 697
  text_hund: Jack ist ein ganz lieber Kerl, nicht zu stürmisch, freundlich und einfach ein süßer Wuschel. Jedoch ist unser Jack nichts für Anfänger - er kann aggressiv werden, wenn er sich bedroht fühlt (was z.B. beim Besuch des Hundefriseurs vorkommt).
  text_zuhause: Für Jack brauchen wir unbedingt sehr hundeerfahrene Menschen, die ihm eine konsequent begegnen, sich nicht einschüchtern lassen und mit einem ängstlichen Hund umgehen können. Jack sollte in ein kinderloses Zuhause vermittelt werden.
