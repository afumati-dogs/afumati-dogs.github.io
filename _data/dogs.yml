  text_hund: Willy wurde 2021 aus einem illegalen Shelter gerettet. Er ist freundlich und gibt in seinem Zwinger den Ton an. Willy lebt mit Leo zusammen in einem Zwinger. Er ist aktiv und sozial. Mit seinem wunderschönen,langem, schokobraunen Fell sticht er einem direkt ins Auge. Anfangs ist Willy etwas schüchtern gegenüber Fremden, zeigt sich im Shelter aber sehr neugierig und selbstbewusst.
  text_zuhause: Willy sollte in ein hundeerfahrenes Zuhause reisen, gern auch zu aktiven Senioren (super toll wäre da natürlich ei Garten, das ist aber kein Muss). Willy möchte gern gefordert und gefördert werden. Bei Rüden entscheidet die Sympathie, mit Hündinnen ist er gut verträglich.
