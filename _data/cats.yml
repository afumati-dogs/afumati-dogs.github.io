- name: Kitty
  alter: 12/2018
  größe: klein und schmächtig
  geschlecht: Weiblich
  charakter: lieb, schmusig, liebevoll, schlau, neugierig
  text_hund: Kitty ist Susanne durch ihre seltsame Kopfhaltung in den Straßen Afumatis im Oktober 2024 aufgefallen. In der Klinik stellte man fest, dass Kitty durch Toxoplasmose schwere Nervenschäden im Gehirn erlitten hat. Das sah im CT aus wie ein durch Toxoplasmose ausgelöster Schlaganfall. Kitty bekam Medikamente und hochdosierten Vitamin B Komplex. Kitty hat mit Hunden keinerlei Probleme und auch mit Artgenossen nicht. Sie ist einfach anders, etwas grob und tollpatschig gegenüber Artgenossen, aber stets freundlich, ja sogar rücksichtsvoll. Sie hat eine unglaubliche Liebe zu geben, wirklich schlau und lern sehr schnell.Kitty ist empathisch und neugierig und auch schmusig.
  text_zuhause: Kitty braucht Menschen, die ihhr anders-sein nicht stört. Sie ist besonders auf ihre eigene Art und Weise, absolut stubenrein, kann alles wie jede andere Katze auch. Nur ihr Kopf ist etwas schief, durch den Schlaganfall. Wer öffnet sein Herz für diese wunderbare Katze, die auch nur geliebt werden möchte.
- name: Frida
  alter: 07/2025
  größe: klein
  geschlecht: Weiblich
  charakter: aktiv, munter, selbstbewusst, neugierig, verspielt, verträglich mit Hunden
  text_hund: Sie liebt es mit Bällen zu spielen.
  text_zuhause: Wir vermitteln Frida bevorzugt in ein Zuhause mit einer anderen Katze. Gerne vermitteln wir sie mit einem unserer anderen Schützlinge zusammen.
- name: Ina
  alter: 08/2025
  größe: klein
  geschlecht: Weiblich
  charakter: clever, verspielt, aktiv
  text_hund: Hunde und andere Katzen gewöhnt. Freundlich, neugierig und immer aufgeschlossen.
  text_zuhause: Ina sollte nicht als Einzelkatze gehalten werden. Sie freut sich über Gesellschaft. Gerne vermitteln wir sie mit einem unserer anderen Schützlinge zusammen oder in ein Zuhause in dem bereits mindestens eine Katze lebt.
- name: Fee
  alter: 07/2025
  größe: klein
  geschlecht: Weiblich
  charakter: lieb, süß, zutraulich, fürsorglich
  text_hund: Mama von Steffi und Mo. Fee ist eine ehemalige Straßenkatze, die Susanne immer gefüttert hat. Fee ist zutraulig und hat in der Winterkälte Rumäniens ihre Kitten auf die Welt gebracht. Nun ist sie bei Susanne in Sicherheit und wartet auf ihr Für-immer-Zuhause.
  text_zuhause: Fee sollte nicht als Einzelkatze gehalten werden. Sie freut sich über Gesellschaft. Gerne vermitteln wir sie mit einem unserer anderen Schützlinge zusammen oder in ein Zuhause in dem bereits mindestens eine Katze lebt.
