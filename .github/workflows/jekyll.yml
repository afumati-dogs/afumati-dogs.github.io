name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  fix-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Fix YAML issues
        run: |
          for file in _data/cats.yml _data/dogs.yml; do
            if [ -f "$file" ]; then
              # Fix unquoted strings with colons
              sed -i 's/^\(\s*text_\(hund\|zuhause\):\s*\)\([^"]*:[^"]*\)$/\1"\3"/g' "$file"
              
              # Remove trailing whitespace
              sed -i 's/[[:space:]]*$//' "$file"
              
              # Fix duplicate list markers
              sed -i '/^- - /s/^- - /- /' "$file"
            fi
          done

      - name: Commit and push fixes if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add _data/*.yml
            git commit -m "fix: auto-correct YAML syntax issues"
            git push
          fi

  validate:
    runs-on: ubuntu-latest
    needs: fix-yaml
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Validate YAML Syntax
        run: |
          yamllint _data/cats.yml _data/dogs.yml

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AJV CLI
        run: npm install -g ajv-cli

      - name: Validate YAML Schema
        run: |
          for file in _data/cats.yml _data/dogs.yml; do
            ajv validate -s .github/schema/animal.json -d "$file" || exit 1
          done

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install Dependencies
        run: |
          bundle update listen
          bundle lock --add-platform ruby
          bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
