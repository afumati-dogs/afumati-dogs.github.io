name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Validate YAML Syntax
        run: |
          yamllint _data/cats.yml _data/dogs.yml

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install AJV CLI
        run: npm install -g ajv-cli

      - name: Validate YAML Schema
        run: |
          for file in _data/cats.yml _data/dogs.yml; do
            ajv validate -s .github/schema/animal.json -d "$file" || exit 1
          done

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install Dependencies
        run: |
          bundle update listen
          bundle lock --add-platform ruby
          bundle install

      - name: Build Jekyll site
        id: build
        run: bundle exec jekyll build
        continue-on-error: true

      - name: Fix YAML quoting issues
        if: steps.build.outcome == 'failure'
        run: |
          # Fix unquoted strings with colons in YAML files
          for file in _data/cats.yml _data/dogs.yml; do
            if [ -f "$file" ]; then
              # Fix unquoted strings with colons
              sed -i 's/^\(\s*text_\(hund\|zuhause\):\s*\)\([^"]*:[^"]*\)$/\1"\3"/g' "$file"
              
              # Remove trailing whitespace
              sed -i 's/[[:space:]]*$//' "$file"
              
              # Fix missing list item dashes (lines that should start with - but don't)
              sed -i '/^[a-z_][a-z_]*:/{N;s/\n  [a-z_]/\n- /;}' "$file"
              
              # Fix indentation issues (ensure proper spacing after colons)
              sed -i 's/:\s\+/ /g; s/: / /g; s/^\([^:]*\):\s\+/\1: /g' "$file"
              
              # Remove duplicate list markers
              sed -i '/^- - /s/^- - /- /' "$file"
            fi
          done

      - name: Retry Jekyll build
        if: steps.build.outcome == 'failure'
        run: bundle exec jekyll build

      - name: Create Fix Pull Request
        if: steps.build.outcome == 'failure'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix: correct YAML syntax in data files'
          title: 'fix: correct YAML syntax in data files'
          body: |
            Automated fix for YAML syntax errors detected during Jekyll build.
            
            **Changes:**
            - Fixed unquoted strings containing colons in text fields
            
            Please review and merge if the changes look correct.
          branch: fix/yaml-syntax
          delete-branch: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
